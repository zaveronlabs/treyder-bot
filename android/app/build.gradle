plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "uz.zaveron.yodla"
    compileSdk 35

    defaultConfig {
        applicationId "uz.zaveron.yodla"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSIYA") ?: "1")
        versionName "1." + (System.getenv("VERSIYA") ?: "1")
        ndk { abiFilters "arm64-v8a" }   // telefonlar uchun; APK kichikroq
    }

    signingConfigs {
        // har safar bir xil kalit: telefonda yangi versiya eskisining ustiga o'rnatiladi
        yodla {
            storeFile file("../yodla.keystore")
            storePassword "yodla-ilova"
            keyAlias "yodla"
            keyPassword "yodla-ilova"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.yodla
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.18.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
