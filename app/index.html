<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Yodla</title>
<meta name="theme-color" content="#07061A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: neon night-arcade in one phone column; bottom tab bar (So'zlar / Darslar / Mashq); tasks are full-screen with a floating toast or error sheet */
:root {
  color-scheme: dark;
  --bg: #07061A; --surface: rgba(24, 21, 58, .74); --surface-2: rgba(40, 35, 92, .55);
  --line: rgba(150, 140, 255, .2); --ink: #EFEDFF; --soft: #A6A1D4; --dim: #6E6A9C;
  --cyan: #2DF0FF; --pink: #FF3FD0; --violet: #8F63FF; --lime: #B4FF4A; --red: #FF4D72; --gold: #FFD447;
  --on-neon: #0A0620; --sheet: #16081C; --bar: rgba(14, 12, 38, .94);
  --grad: linear-gradient(100deg, var(--cyan), var(--violet) 55%, var(--pink));
  --display: "Chakra Petch", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 500 16px/1.45 var(--body); margin: 0; }
.atmo { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(70% 38% at 100% 0%, rgba(255, 63, 208, .2), transparent 70%),
    radial-gradient(70% 42% at 0% 100%, rgba(45, 240, 255, .16), transparent 70%),
    linear-gradient(rgba(150, 140, 255, .055) 1px, transparent 1px) 0 0 / 100% 34px,
    linear-gradient(90deg, rgba(150, 140, 255, .055) 1px, transparent 1px) 0 0 / 34px 100%; }
#app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 14px 24px; display: flex; flex-direction: column; gap: 14px; }
#app.has-tabs { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 700; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }
.muted { color: var(--soft); }
.grow { flex: 1; }
.center { text-align: center; }

/* top */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 4px; }
.brand { font: 700 28px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 12px rgba(143, 99, 255, .6)); }
.chips { display: flex; gap: 8px; align-items: center; }
.chip { display: flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font: 700 14px var(--display); font-variant-numeric: tabular-nums; }
.chip svg { width: 16px; height: 16px; }
.chip.fire svg { color: var(--pink); filter: drop-shadow(0 0 5px var(--pink)); }
.chip.xp svg { color: var(--cyan); filter: drop-shadow(0 0 5px var(--cyan)); }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--soft); }
.icon-btn svg { width: 20px; height: 20px; }

/* hero panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.hero { border-color: rgba(45, 240, 255, .38); box-shadow: 0 0 0 1px rgba(255, 63, 208, .12) inset, 0 14px 44px -14px rgba(143, 99, 255, .6); }
.hero-top { display: flex; gap: 16px; align-items: center; }
.hero-top > div:last-child { min-width: 0; }
.hero h2 { font-size: 21px; }
.hero p { margin-top: 4px; color: var(--soft); font-size: 14.5px; }
.ring { width: 84px; height: 84px; flex: none; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font: 700 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.ring .lbl small { display: block; margin-top: 3px; font: 600 10.5px var(--body); color: var(--soft); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font: 700 20px var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--soft); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--grad); box-shadow: 0 0 10px var(--violet); border-radius: 99px; }

/* buttons */
.btn { min-height: 54px; border-radius: 16px; padding: 0 18px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font: 700 15px var(--display); letter-spacing: .08em; text-transform: uppercase; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.main { background: var(--grad); color: var(--on-neon); box-shadow: 0 0 22px -4px rgba(143, 99, 255, .85), 0 0 40px -12px rgba(255, 63, 208, .7); }
.btn.main:disabled { background: var(--surface-2); color: var(--dim); box-shadow: none; cursor: default; }
.btn.ghost { border: 1px solid var(--line); color: var(--ink); background: rgba(7, 6, 26, .35); }
.btn.ghost:hover { border-color: var(--cyan); }
.btn.danger { background: var(--red); color: var(--on-neon); }
.hero .row .btn { flex: 1 1 150px; width: auto; padding: 0 12px; letter-spacing: .05em; }

.sec { font: 600 12px var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--soft); padding: 4px 2px 0; }

/* lists (packs, lessons) */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { width: 100%; text-align: left; display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.item .num { width: 44px; height: 44px; flex: none; border-radius: 13px; display: grid; place-items: center; font: 700 17px var(--display); background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.item .num svg { width: 20px; height: 20px; }
.item .body { flex: 1; min-width: 0; }
.item .title { display: block; font: 700 16px var(--display); letter-spacing: .02em; }
.item .sub { display: block; font-size: 13px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .end { flex: none; display: flex; gap: 2px; color: var(--gold); }
.item .end svg { width: 15px; height: 15px; }
.item .end .off { color: rgba(150, 140, 255, .25); }
.item .end .lock { color: var(--dim); width: 18px; height: 18px; }
.item.done .num { color: var(--lime); border-color: rgba(180, 255, 74, .5); box-shadow: 0 0 14px -4px rgba(180, 255, 74, .7) inset; }
.item.next { border-color: rgba(45, 240, 255, .65); box-shadow: 0 0 20px -8px var(--cyan); }
.item.next .num { background: var(--grad); color: var(--on-neon); border-color: transparent; }
.item.locked { opacity: .42; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 55%, transparent); }
.tabs nav { max-width: 448px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 6px; border-radius: 20px; background: var(--bar); border: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px; border-radius: 14px; color: var(--dim); font: 600 11.5px var(--display); letter-spacing: .06em; text-transform: uppercase; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--cyan); background: rgba(45, 240, 255, .09); text-shadow: 0 0 10px rgba(45, 240, 255, .7); }
.tab.on svg { filter: drop-shadow(0 0 6px var(--cyan)); }

/* task bar */
.bar { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
.x { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; color: var(--soft); background: var(--surface); border: 1px solid var(--line); flex: none; }
.prog { flex: 1; height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--grad); box-shadow: 0 0 12px var(--violet); border-radius: 99px; transition: width .35s ease; }
.stage { font: 700 14px var(--display); color: var(--soft); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
.bar h2 { font-size: 22px; min-width: 0; }
.task-title { font: 600 13px var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); text-shadow: 0 0 10px rgba(45, 240, 255, .55); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.tag { align-self: flex-start; font: 700 11px var(--display); letter-spacing: .16em; text-transform: uppercase; padding: 3px 9px; border-radius: 8px; border: 1px solid currentColor; }
.tag.en { color: var(--cyan); } .tag.uz { color: var(--lime); } .tag.pink { color: var(--pink); }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.word { font: 700 38px/1.1 var(--display); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; overflow-wrap: anywhere; }
.word.sm { font-size: 26px; }
.ipa { font: 500 16px var(--mono); color: var(--soft); }
.yg { align-self: flex-start; color: var(--cyan); font: 600 14px var(--body); text-decoration: underline; text-underline-offset: 3px; }
.say { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: rgba(45, 240, 255, .1); border: 1px solid rgba(45, 240, 255, .55); color: var(--cyan); box-shadow: 0 0 16px -4px var(--cyan); flex: none; }
.say svg { width: 22px; height: 22px; }
.say.big { width: 104px; height: 104px; }
.say.big svg { width: 44px; height: 44px; }
.slow { min-width: 56px; height: 56px; border-radius: 50%; border: 1px solid rgba(255, 63, 208, .55); color: var(--pink); font: 700 14px var(--display); box-shadow: 0 0 14px -5px var(--pink); }
.ex { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; width: 100%; }
.ex .en { font-weight: 700; }
.ex .uz { color: var(--lime); }
.ex .hint { font-size: 13px; color: var(--dim); }
.uzcard { border-radius: 22px; padding: 16px 20px; background: rgba(180, 255, 74, .06); border: 1px solid rgba(180, 255, 74, .32); display: flex; flex-direction: column; gap: 6px; }
.uzcard .w { font: 700 26px var(--display); overflow-wrap: anywhere; }

/* options */
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { width: 100%; min-height: 56px; padding: 10px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font: 700 17px var(--body); text-align: center; transition: border-color .15s, box-shadow .15s, transform .1s; }
.opt:active { transform: scale(.98); }
.opt.sel { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 16px -4px var(--cyan); }
.opt.right { border-color: var(--lime); color: var(--lime); background: rgba(180, 255, 74, .08); box-shadow: 0 0 18px -4px var(--lime); }
.opt.wrong { border-color: var(--red); color: var(--red); background: rgba(255, 77, 114, .08); box-shadow: 0 0 18px -4px var(--red); }
.opt.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-6px) } 40% { transform: translateX(6px) } 60% { transform: translateX(-4px) } 80% { transform: translateX(3px) } }
.opts.sent .opt { text-align: left; font-size: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid3 .opt { min-height: 48px; font-size: 15px; padding: 8px; }
.match { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.match .opt { font-size: 15px; min-height: 58px; padding: 8px 10px; overflow-wrap: anywhere; }

/* letters */
.listen { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 8px 0; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 18px; }
.slotw { display: flex; gap: 6px; }
.slot { width: 38px; height: 46px; border-radius: 10px; border: 1.5px dashed var(--line); display: grid; place-items: center; font: 700 22px var(--display); }
.slot.f { border: 1.5px solid var(--cyan); color: var(--cyan); box-shadow: 0 0 10px -3px var(--cyan); }
.slot.fixed { border: 0; width: 12px; }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.tilebtn { width: 50px; height: 54px; border-radius: 13px; background: var(--surface-2); border: 1px solid rgba(143, 99, 255, .55); font: 700 22px var(--display); box-shadow: 0 4px 0 rgba(143, 99, 255, .4); }
.tilebtn.used { visibility: hidden; }

/* sentence builder */
.answer { min-height: 116px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 10px 0; background: repeating-linear-gradient(to bottom, transparent 0 53px, var(--line) 53px 54px); }
.bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.wchip { padding: 10px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid rgba(143, 99, 255, .55); font: 700 16px var(--body); box-shadow: 0 3px 0 rgba(143, 99, 255, .4); }
.wchip.used { visibility: hidden; }
.answer .wchip { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 3px 0 rgba(45, 240, 255, .3); }

/* fill */
.sent { font: 700 26px/1.4 var(--display); overflow-wrap: anywhere; }
.blank { display: inline-block; min-width: 72px; border-bottom: 3px solid var(--pink); color: var(--pink); text-align: center; padding: 0 6px; text-shadow: 0 0 10px rgba(255, 63, 208, .6); }
.blank.ok { border-color: var(--lime); color: var(--lime); text-shadow: 0 0 10px rgba(180, 255, 74, .6); }
.uzline { color: var(--soft); font-size: 15px; }

/* feedback */
.toast { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20; padding: 12px 22px; border-radius: 999px; background: var(--bar); border: 1px solid var(--lime); color: var(--lime); font: 700 18px var(--display); letter-spacing: .06em; box-shadow: 0 0 28px -4px var(--lime); display: flex; gap: 10px; align-items: center; white-space: nowrap; animation: pop .25s ease-out; }
.toast small { color: var(--cyan); font-size: 13px; }
/* 6 oylik reja */
.mission { gap: 8px; }
.mhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.mhead b { font: 700 16px var(--display); letter-spacing: .04em; }
.mrow { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); color: inherit; font: inherit; }
.mrow.on { opacity: .6; } .mrow.on span:last-child { text-decoration: line-through; }
.mchk { width: 24px; height: 24px; flex: none; border-radius: 8px; border: 1.5px solid var(--cyan); display: grid; place-items: center; color: var(--on-neon); }
.mrow.on .mchk { background: var(--lime); border-color: var(--lime); }
.mchk svg { width: 16px; height: 16px; }
.plancta { text-align: left; color: inherit; font: inherit; border-color: rgba(255, 79, 216, .5); }
.chap { gap: 12px; }
.chead { display: flex; align-items: center; gap: 14px; }
.chead > div { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.chead .num { width: 44px; height: 44px; flex: none; border-radius: 13px; display: grid; place-items: center; font: 700 17px var(--display); background: var(--surface-2); border: 1px solid var(--line); }
.chead .num svg { width: 20px; height: 20px; }
.chead .cnt { font: 700 14px var(--display); color: var(--soft); font-variant-numeric: tabular-nums; }
.chap.open { border-color: rgba(45, 240, 255, .65); box-shadow: 0 0 20px -8px var(--cyan); }
.chap.open .num { background: var(--grad); color: var(--on-neon); border-color: transparent; }
.chap.done .num { color: var(--lime); border-color: var(--lime); }
.chap.locked { opacity: .42; }
.quest { display: flex; flex-direction: column; gap: 6px; }
.qrow { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; }
.qrow small { color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.quest.ok .qrow span { color: var(--lime); }
.meter.sm { height: 6px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 12px 8px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); opacity: .45; }
.badge.on { opacity: 1; border-color: rgba(255, 200, 60, .6); box-shadow: 0 0 18px -8px var(--gold); }
.badge span { font-size: 26px; } .badge b { font-size: 13px; } .badge small { font-size: 11px; color: var(--soft); }
.cando { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.cando-box summary { cursor: pointer; color: var(--cyan); font-weight: 600; }
.cando-box .cando { margin-top: 10px; }
.toast.gold { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 28px -4px var(--gold); white-space: normal; text-align: center; max-width: calc(100vw - 32px); }

@keyframes pop { from { transform: translate(-50%, -12px) scale(.9); opacity: 0 } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--sheet); border-top: 1px solid var(--red); box-shadow: 0 -12px 40px -12px rgba(255, 77, 114, .7); animation: up .22s ease-out; }
.sheet .in { max-width: 448px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.sheet h3 { color: var(--red); font-size: 22px; text-shadow: 0 0 12px rgba(255, 77, 114, .6); }
.sheet p { margin-bottom: 6px; overflow-wrap: anywhere; }
.sheet p b { color: var(--lime); }
.sheet .btn { background: var(--red); color: var(--on-neon); }
@keyframes up { from { transform: translateY(100%) } }

/* results */
.big-stars { display: flex; justify-content: center; gap: 10px; padding-top: 8px; }
.big-stars svg { width: 56px; height: 56px; }
.big-stars .on { color: var(--gold); filter: drop-shadow(0 0 12px var(--gold)); }
.big-stars .off { color: rgba(150, 140, 255, .22); }
.res { display: flex; flex-direction: column; gap: 8px; }
.resw { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.resw > div:first-child { min-width: 0; }
.resw b { display: block; }
.resw small { color: var(--soft); }
.marks { display: flex; gap: 6px; flex: none; }
.marks span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: var(--lime); border: 1px solid var(--lime); }
.marks span.no { color: var(--red); border-color: var(--red); }
.xpgain { font: 700 20px var(--display); color: var(--cyan); text-shadow: 0 0 12px rgba(45, 240, 255, .65); }
.score { font: 700 54px/1 var(--display); text-align: center; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 14px rgba(143, 99, 255, .6)); font-variant-numeric: tabular-nums; }

/* theory */
.rule { font-size: 16px; line-height: 1.6; }
.rule b { color: var(--cyan); }
.tbl { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); }
.tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.tr:first-child { border-top: 0; }
.tr > * { min-width: 0; }
.tr b { color: var(--cyan); font: 700 15.5px var(--display); }
.tr span { color: var(--soft); font-size: 14px; }
.tr .say { width: 34px; height: 34px; box-shadow: none; }
.tr .say svg { width: 16px; height: 16px; }
.dialog .tr { grid-template-columns: auto minmax(0, 1fr) auto; }
.tr .who { font: 700 13px var(--display); color: var(--pink); width: 18px; }
.note { border-left: 3px solid var(--pink); padding: 2px 0 2px 12px; color: var(--soft); font-size: 14.5px; }

/* practice */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); min-height: 160px; }

}

function drill(pi) {
  const words = PACKS[pi].words;
  const marks = Object.fromEntries(words.map((w) => [w.id, [true, true, true]]));
  const queue = [
    ...shuffle(words).map((w) => ({ type: "choose", w, stage: 1 })),
    { type: "match", ws: words, stage: 2 },
    ...shuffle(words).map((w) => ({ type: "build", w, stage: 3 })),
  ];
  runQueue(queue, {
    stages: 3, back: home,
    onMiss: (task, wid) => { if (marks[wid]) marks[wid][task.stage - 1] = false; },
    onDone: (misses) => finishPack(pi, marks, misses),
  });
}

function review() {
  const ids = shuffle(dueWords()).slice(0, 20);
  if (!ids.length) return home();
  const types = ["choose", "chooseUz", "build"];
  const queue = ids.map((id, i) => ({ type: types[(i + Math.floor(Math.random() * 3)) % 3], w: BY[id] }));
  const missed = new Set();
  runQueue(queue, {
    back: home,
    onMiss: (task, wid) => missed.add(wid),
    onDone: () => {
      ids.forEach((id) => {
        const v = S.words[id];
        if (missed.has(id)) { v.box = 0; v.due = startOfDay() + DAY; }
        else { v.box = Math.min(v.box + 1, INTERVALS.length - 1); v.due = startOfDay() + INTERVALS[v.box] * DAY; }
      });
      bumpStreak(); save();
      reviewDone(ids, missed);
    },
  });
}

// ---------- vazifalar dvigateli ----------
function runQueue(queue, cfg) {
  let i = 0, misses = 0, done = 0, firstOk = 0;
  const total = queue.length;
  function next() {
    if (i >= queue.length) return cfg.onDone(misses, firstOk, total);
    const task = queue[i];
    window.__t = task;
    const pct = Math.min(100, (done / total) * 100);
    const label = cfg.stages ? `${task.stage}/${cfg.stages}` : `${Math.min(done + 1, total)}/${total}`;
    const head = `
      <div class="bar">
        <button class="x" id="quit" type="button" aria-label="Chiqish">×</button>
        <div class="prog"><i style="width:${pct}%"></i></div>
        <span class="stage">${label}</span>
      </div>`;
    const finish = (ok, wid, correctText) => {
      if (ok === null) { if (!task.retry) done++; i++; return next(); }
      if (ok) {
        if (!task.retry) { done++; firstOk++; }
        const xp = task.retry ? 5 : 10;
        addXP(xp); toast(xp);
        later(() => { i++; next(); }, 850);
      } else {
        misses++; if (cfg.onMiss) cfg.onMiss(task, wid);
        sheet(correctText, () => { if (!task.retry) done++; queue.push({ ...task, retry: true }); i++; next(); });
      }
    };
    const t = task.type;
    if (t === "choose" || t === "chooseUz") taskChoose(head, task.w, t === "choose" ? "en" : "uz", finish);
    else if (t === "match") taskMatch(head, task.ws, (wid) => { misses++; if (cfg.onMiss) cfg.onMiss(task, wid); }, () => finish(true));
    else if (t === "build") taskBuild(head, task.w, finish);
    else if (t === "fill") taskFill(head, task, finish);
    else if (t === "order") taskOrder(head, task, finish);
    else if (t === "tr") taskTr(head, task, finish);
    else if (t === "listen") taskListen(head, task, finish, cfg.pool || []);
    else if (t === "speak") taskSpeak(head, task, finish);
    else if (t === "answer") taskAnswer(head, task, finish);
    $("quit").onclick = cfg.back;
  }
  next();
}

// juftlarni topish (har qatorda chap va o'ng tugma bir balandlikda)
function taskMatch(head, ws, miss, done) {
  const L = shuffle(ws), R = shuffle(ws);
  html(`${head}
    <div class="task-title">Juftlarni toping</div>
    <div class="match">${L.map((w, j) => `<button class="opt" data-side="uz" data-id="${esc(w.id)}" type="button">${esc(w.uz)}</button><button class="opt" data-side="en" data-id="${esc(R[j].id)}" type="button">${esc(R[j].en)}</button>`).join("")}</div>
    <div class="grow"></div>
  `);
  let sel = null, left = ws.length; const missed = new Set();
  on(".match .opt", (e) => {
    const b = e.currentTarget;
    if (b.classList.contains("right")) return;
    if (b.dataset.side === "en") speak(b.dataset.id);
    if (!sel || sel.dataset.side === b.dataset.side) { if (sel) sel.classList.remove("sel"); sel = b; b.classList.add("sel"); return; }
    if (sel.dataset.id === b.dataset.id) {
      [sel, b].forEach((x) => { x.classList.remove("sel"); x.classList.add("right"); x.disabled = true; });
      sel = null; left--;
      if (!left) done(); else ding(true);
    } else {
      const a = sel; a.classList.remove("sel"); sel = null; ding(false);
      [a, b].forEach((x) => { x.classList.remove("shake"); void x.offsetWidth; x.classList.add("shake"); });
      [a.dataset.id, b.dataset.id].forEach((id) => { if (!missed.has(id)) { missed.add(id); miss(id); } });
    }
  });
}

// eshitib, harflardan yig'ish
function taskBuild(head, w, finish) {
  const target = w.en.toLowerCase();
  const chars = [...target];
  const tiles = shuffle(chars.filter((c) => /[a-z]/.test(c)));
  const filled = chars.map((c) => (/[a-z]/.test(c) ? null : c));
  const groups = target.split(" ");
  html(`${head}
    <div class="task-title">Eshiting va so'zni yig'ing</div>
    <div class="listen"><button class="say big" id="sw" type="button" aria-label="Qayta tinglash">${SPK}</button><button class="slow" id="slow" type="button" aria-label="Sekin tinglash">0.6×</button></div>
    <div class="slots" id="slots"></div>
    <div class="tiles">${tiles.map((c, k) => `<button class="tilebtn" data-k="${k}" type="button">${esc(c)}</button>`).join("")}</div>
    <div class="grow"></div>
    <button class="btn main" id="chk" type="button" disabled>Tekshirish</button>
  `);
  const used = [];
  let locked = false;
  function drawSlots() {
    let pos = 0;
    $("slots").innerHTML = groups.map((g) => {
      const s = [...g].map(() => {
        const p = pos++, c = filled[p];
        if (!/[a-z]/.test(chars[p])) return `<span class="slot fixed">${esc(c)}</span>`;
        return `<button class="slot ${c ? "f" : ""}" data-p="${p}" type="button" aria-label="${c ? "Harfni qaytarish" : "Bo'sh joy"}">${c ? esc(c) : ""}</button>`;
      }).join("");
      pos++;
      return `<span class="slotw">${s}</span>`;
    }).join("");
    $app.querySelectorAll(".slot[data-p]").forEach((el) => el.onclick = () => {
      if (locked) return;
      const p = +el.dataset.p; if (!filled[p]) return;
      $app.querySelector(`.tilebtn[data-k="${used[p]}"]`).classList.remove("used");
      filled[p] = null; used[p] = undefined; drawSlots();
    });
    $("chk").disabled = locked || filled.some((c) => c === null);
  }
  drawSlots();
  on(".tilebtn", (e) => {
    const b = e.currentTarget; if (locked || b.classList.contains("used")) return;
    const p = filled.findIndex((c) => c === null); if (p < 0) return;
    filled[p] = tiles[+b.dataset.k]; used[p] = +b.dataset.k; b.classList.add("used");
    drawSlots();
  });
  $("sw").onclick = () => speak(w.en);
  $("slow").onclick = () => speak(w.en, 0.6);

// so'zlardan gap tuzish
function taskOrder(head, t, finish) {
  const target = tokens(t.en);
  const bank = shuffle([...target, ...(t.extra || [])]);
  const picked = [];
  let locked = false;
  html(`${head}
    <div class="task-title">Gapni tuzing</div>
    <div class="card"><span class="tag uz">O'zbekcha</span><div class="word sm">${esc(t.uz)}</div></div>
    <div class="answer" id="ans"></div>

    <div class="grow"></div>
    <button class="btn main" id="chk" type="button" disabled>Tekshirish</button>
  `);
  function draw() {
    $("ans").innerHTML = picked.map((j, p) => `<button class="wchip" data-p="${p}" type="button">${esc(bank[j])}</button>`).join("");
    $app.querySelectorAll("#ans .wchip").forEach((el) => el.onclick = () => {
      if (locked) return;
      const j = picked.splice(+el.dataset.p, 1)[0];
      $app.querySelector(`#bank [data-j="${j}"]`).classList.remove("used"); draw();
    });
    $("chk").disabled = locked || picked.length === 0;

  draw();
  $app.querySelectorAll("#bank .wchip").forEach((el) => el.onclick = () => {
    if (locked || el.classList.contains("used")) return;
    el.classList.add("used"); picked.push(+el.dataset.j); speak(bank[+el.dataset.j], 1); draw();
  });
  $("chk").onclick = () => {
    if (locked) return; locked = true; draw();
    const ok = picked.map((j) => bank[j].toLowerCase()).join(" ") === target.map((x) => x.toLowerCase()).join(" ");
    speak(t.en);
    finish(ok, t.wid, t.en);

// ovoz chiqarib aytish (hide: faqat o'zbekchasi ko'rinadi, inglizchasini o'zi tuzib aytadi)
function taskSpeak(head, t, finish) {
  let tries = 0, busy = false, locked = false, shown = !t.hide;
  html(`${head}
    <div class="task-title">${t.auto ? "Andrew'dan keyin darhol takrorla" : t.hide ? "Inglizcha qanday aytiladi?" : "Tinglang va ovoz chiqarib ayting"}</div>
    <div class="card">
      <div class="uzline big">${esc(t.uz)}</div>
      <div class="sent spk" id="tgt"></div>
      <div class="row">${t.hide ? `<button class="yg" id="hint" type="button">Javobni ko'rish</button>` : `<button class="say" id="sw" type="button" aria-label="Tinglash">${SPK}</button>`}</div>
    </div>
    <div class="grow"></div>
    <p class="center heard" id="msg">${canHear ? "Mikrofonni bosing va gapiring" : "Bu oynada mikrofon ishlamaydi. Yodla ilovasini telefonda oching."}</p>
    <div class="micwrap"><button class="mic" id="mic" type="button" aria-label="Gapirish" ${canHear ? "" : "disabled"}>${MIC}</button></div>
    <button class="btn ghost" id="skip" type="button">Hozir gapira olmayman</button>
  `);
  const tgt = $("tgt");
  const draw = (res) => { tgt.innerHTML = res ? marked(res) : shown ? esc(t.en) : `<span class="hid">• • •</span>`; };
  draw();
  if ($("sw")) $("sw").onclick = () => speak(t.en);
  if (t.auto) later(() => speakThen(t.en, () => { if (document.body.contains(tgt) && !busy && !locked && canHear) $("mic").click(); }), 300);
  else if ($("sw")) later(() => speak(t.en), 300);
  if ($("hint")) $("hint").onclick = () => { shown = true; draw(); speak(t.en); $("hint").remove(); };
  $("mic").onclick = () => {
    if (locked) return;
    if (busy) { stopHear(); busy = false; $("mic").classList.remove("on"); $("msg").textContent = "Mikrofonni bosing va gapiring"; return; }
    busy = true; $("mic").classList.add("on"); $("msg").textContent = "Eshityapman... gapiring";
    hear((err, alts) => {
      busy = false;
      if (!document.body.contains(tgt)) return;
      $("mic").classList.remove("on");
      if (err) { $("msg").textContent = hearError(err); return; }
      const res = speechCheck(t.en, alts); tries++; shown = true;
      draw(res);
      const heard = `Eshitildi: <i>${esc(res.heard || "...")}</i>`;
      if (res.ok) { locked = true; $("msg").innerHTML = heard; stat("spoken"); finish(true, t.wid, t.en); }
      else if (tries >= 3) { locked = true; $("msg").innerHTML = heard; finish(false, t.wid, t.en); }
      else { $("msg").innerHTML = `${heard}<br>Qizil so'zlarni yana bir bor aytib ko'ring.`; speak(t.en); }
    });
  };
  $("skip").onclick = () => { if (!locked) { locked = true; finish(null); } };
}

// suhbat o'yini: Andrew bir tomonni gapiradi, sen ikkinchi tomonni aytasan
function rolePlay(li, me, back) {
  const L = LESSONS[li], rows = L.rows, ai = me === "A" ? "B" : "A";
  let k = 0, good = 0, mine = 0, tries = 0, busy = false, cur = null;
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><h2>${esc(L.title.replace("Suhbat: ", ""))}</h2></div>
    <p class="muted">Sen: <b>${me}</b>. Andrew: <b>${ai}</b>. Andrew gapirgach, mikrofonni bosib o'z gapingni ayt.</p>
    <div class="chat" id="chat"></div>
    <div class="grow"></div>
    <div class="rpctl">
      <p class="center heard" id="msg"></p>
      <div class="micwrap"><button class="mic" id="mic" type="button" aria-label="Gapirish" disabled>${MIC}</button></div>
      <div class="row2"><button class="btn ghost" id="hint" type="button" disabled>Tinglash</button><button class="btn ghost" id="skip" type="button" disabled>O'tkazish</button></div>
    </div>
  `);
  $("quit").onclick = back;
  const chat = $("chat");
  const setBtns = (on) => ["mic", "hint", "skip"].forEach((id) => { $(id).disabled = !on || (id === "mic" && !canHear); });
  function bubble(r, cls, text) {
    const el = document.createElement("div");
    el.className = `bub ${cls}`;
    el.innerHTML = `<span class="who">${r[0] === me ? "Sen" : "Andrew"}</span><b class="spk">${text}</b><small>${esc(r[2])}</small>`;
    chat.appendChild(el); el.scrollIntoView({ behavior: "smooth", block: "center" });
    return el;
  }
  function step() {
    if (!document.body.contains(chat)) return;
    if (k >= rows.length) return finishRP();
    const r = rows[k];
    if (r[0] === ai) { bubble(r, "ai", esc(r[1])); setBtns(false); $("msg").textContent = "Andrew gapiryapti..."; speakThen(r[1], () => { k++; later(step, 350); }); return; }
    mine++; tries = 0;
    cur = bubble(r, "me now", esc(r[1]));
    setBtns(true);
    $("msg").textContent = canHear ? "Sening navbating: mikrofonni bosib ayt" : "Bu oynada mikrofon ishlamaydi. Yodla ilovasini telefonda oching.";
  }
  function next(ok) { if (ok) good++; cur.classList.remove("now"); setBtns(false); k++; later(step, ok ? 700 : 1200); }
  $("hint").onclick = () => speak(rows[k][1]);
  $("skip").onclick = () => { stopHear(); busy = false; $("mic").classList.remove("on"); next(false); };
  $("mic").onclick = () => {
    if (busy) { stopHear(); busy = false; $("mic").classList.remove("on"); $("msg").textContent = "Mikrofonni bosib ayt"; return; }
    busy = true; $("mic").classList.add("on"); $("msg").textContent = "Eshityapman... gapir";
    const r = rows[k];
    hear((err, alts) => {
      busy = false;
      if (!document.body.contains(chat)) return;
      $("mic").classList.remove("on");
      if (err) { $("msg").textContent = hearError(err); return; }
      const res = speechCheck(r[1], alts); tries++;
      cur.querySelector("b").innerHTML = marked(res);
      const heard = `Eshitildi: <i>${esc(res.heard || "...")}</i>`;
      if (res.ok) { ding(true); $("msg").innerHTML = `${pick(PRAISE)} ${heard}`; stat("spoken"); next(true); }
      else if (tries >= 2) { ding(false); $("msg").innerHTML = `${heard}<br>Mayli, Andrew to'g'risini aytadi, davom etamiz.`; setBtns(false); speakThen(r[1], () => next(false)); }
      else { $("msg").innerHTML = `${heard}<br>Qizil so'zlarni yana bir bor ayt.`; }
    });
  };
  function finishRP() {
    const st = good === mine ? 3 : good >= mine * 0.6 ? 2 : 1;
    addXP(15); bumpStreak(); save(); markSet("dlg", L.id); dayMark("lesson");
    html(`
      <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><h2>Suhbat tugadi</h2></div>
      <div class="big-stars" role="img" aria-label="${st} yulduz">${stars(st)}</div>
      <div class="score">${good}/${mine}</div>
      <p class="center muted">gapingni ilova birinchi yoki ikkinchi urinishda tushundi</p>
      <p class="center"><span class="xpgain">+15 XP</span></p>
      <div class="grow"></div>
      <button class="btn main" id="sw2" type="button">Rollarni almashtirish (sen ${ai})</button>
      <button class="btn ghost" id="ag" type="button">Yana bir marta</button>
      <button class="btn ghost" id="bk" type="button">Orqaga</button>
    `);
    $("quit").onclick = back; $("bk").onclick = back;
    $("sw2").onclick = () => rolePlay(li, ai, back);
    $("ag").onclick = () => rolePlay(li, me, back);
  }
  later(step, 400);
}

// mashq zali: ovoz chiqarib gapirish
function speakPool() {
  const out = [], wr = lvRank(workLv());
  learnedWords().forEach((w) => out.push({ en: w.ex, uz: w.exUz, wid: w.id }));
  LESSONS.forEach((L) => {
    // o'z darajangdagi darslar (o'tilmagan bo'lsa ham) va o'tilgan darslar
    if (!S.lessons[L.id] && lvRank(L.lv) !== wr) return;
    (L.ex || []).forEach((r) => out.push({ en: r[0], uz: r[1] }));
    if (L.dialog) L.rows.forEach((r) => out.push({ en: r[1], uz: r[2] }));
  });
  if (out.length < 8) { PACKS[0].words.concat(PACKS[1].words).forEach((w) => out.push({ en: w.ex, uz: w.exUz })); LESSONS[0].ex.forEach((r) => out.push({ en: r[0], uz: r[1] })); }
  return out;
}

function placementTest() {
  let b = 0, j = 0, ok = 0, passed = -1, n = 0;
  const total = TEST.reduce((s, x) => s + x.tasks.length, 0);
  function next() {
    const band = TEST[b];
    if (j - ok > band.tasks.length - 4) return testResult(passed);          // bu darajadan o'tib bo'lmaydi
    if (j >= band.tasks.length) { passed = b; b++; j = 0; ok = 0; return b < TEST.length ? next() : testResult(passed); }
    const t = band.tasks[j];
    const head = `<div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><div class="prog"><i style="width:${(n / total) * 100}%"></i></div><span class="stage">${band.lv}</span></div>`;
    const fin = (good) => { if (good) ok++; j++; n++; later(next, 750); };
    if (t.k === "fill") taskFill(head, t, fin); else if (t.k === "tr") taskTr(head, t, fin); else taskListen(head, t, fin, []);
    $("quit").onclick = home;
  }
  next();
}

function todayRec() {
  const t = todayStr();
  if (!S.today || S.today.d !== t) S.today = { d: t, spoken: 0, lesson: false, words: false, bonus: false };
  return S.today;
}
// hisoblagichlar: spoken (to'g'ri aytilgan gaplar), answers (O'zim haqimda javoblari)
function stat(k, n = 1) {
  S.stats = S.stats || {};
  S.stats[k] = (S.stats[k] || 0) + n;
  if (k === "spoken") todayRec().spoken += n;
  save(); afterProgress();
}
function dayMark(k) { todayRec()[k] = true; save(); afterProgress(); }
function markSet(k, id) { S.stats = S.stats || {}; (S.stats[k] = S.stats[k] || {})[id] = Date.now(); save(); afterProgress(); }
const stv = (k) => (S.stats && S.stats[k]) || 0;
const cnt = (k) => Object.keys((S.stats && S.stats[k]) || {}).length;
const P = {
  words: () => Object.keys(S.words).length,

  street: () => PACKS.filter((p) => p.free && S.packs[p.title]).length,
  streak: () => Math.max(S.bestStreak || 0, streakNow()),
  lessons: (lv) => LESSONS.filter((l) => l.lv === lv && S.lessons[l.id]).length,
};
const missionItems = () => {

  return [
    { id: "words", label: "So'zlar: takrorlash yoki yangi paket", done: d.words, go: () => { if (dueWords().length) return review(); const wr = lvRank(workLv()); let i = PACKS.findIndex((p) => !S.packs[p.title] && !p.free && lvRank(p.lv) >= wr); if (i < 0) i = PACKS.findIndex((p) => !S.packs[p.title]); i >= 0 ? learn(i) : home(); } },
    { id: "spoken", label: `10 ta gapni ovoz chiqarib ayt (${Math.min(d.spoken, 10)}/10)`, done: d.spoken >= 10, go: practiceSpeak },
    { id: "lesson", label: "Bitta dars yoki suhbat", done: d.lesson, go: lessonsTab },

};
let toastQ = 0;
function lateToast(text) {
  const k = ++toastQ;
  setTimeout(() => {
    const el = document.createElement("div");
    el.className = "toast gold"; el.setAttribute("role", "status"); el.innerHTML = text;
    document.body.appendChild(el); ding(true);
    setTimeout(() => el.remove(), 2200);
  }, 1300 * k);
  setTimeout(() => { toastQ = Math.max(0, toastQ - 1); }, 1300 * k + 100);
}
function afterProgress() {
  const d = todayRec();
  if (!d.bonus && missionItems().every((m) => m.done)) { d.bonus = true; addXP(30); save(); lateToast("Bugungi missiya bajarildi! <small>+30 XP</small>"); }
  S.badges = S.badges || {};
  for (const b of BADGES) if (!S.badges[b.id] && b.ok()) { S.badges[b.id] = Date.now(); save(); lateToast(`🏅 Yutuq: ${esc(b.t)}`); }
}

  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><h2>Dars tugadi</h2></div>
    <div class="big-stars" role="img" aria-label="${st} yulduz">${stars(st)}</div>
    <p class="center"><span class="xpgain">+20 XP bonus</span></p>
    <p class="center muted">"${esc(L.title)}": ${misses === 0 ? "bitta ham xatosiz!" : `${misses} ta xato. Qoidani yana bir ko'rib chiqing.`}</p>
    <div class="grow"></div>
    ${nextLessonOf(li) !== undefined ? `<button class="btn main" id="nx" type="button">Keyingi dars</button>` : ""}
    <button class="btn ghost" id="bk" type="button">Darslar ro'yxati</button>
  `);
  $("quit").onclick = lessonsTab; $("bk").onclick = lessonsTab;
  if ($("nx")) $("nx").onclick = () => lessonTheory(nextLessonOf(li));
}

// ---------- 3-bo'lim: Mashq ----------
function practiceTab() {
  const n = learnedWords().length, ok = n >= 5;
  html(`${topBar()}
    <section class="panel hero">
      <div><h2>Mashq zali</h2><p>${ok ? `O'rgangan ${n} ta so'zingiz va ularning misol gaplari bilan mashq qiling.` : "Mashqlar o'rgangan so'zlaringizdan tuziladi. Avval So'zlar bo'limida 1-paketni tugating."}</p></div>
    </section>
    <div class="modes">
      <button class="mode v" id="m5" type="button"><span class="ic">${MIC}</span><b>Gapirish</b><span>Gaplarni ovoz chiqarib ayting, ilova tekshiradi</span></button>
      <button class="mode r" id="m6" type="button"><span class="ic">${M_CHAT}</span><b>Suhbat o'yini</b><span>Andrew bilan navbatma-navbat gaplashing</span></button>
      <button class="mode g" id="m7" type="button"><span class="ic">${M_ME}</span><b>O'zim haqimda</b><span>Savollarga o'zing haqingda javob ber</span></button>
      <button class="mode p" id="m8" type="button"><span class="ic">${M_SHADOW}</span><b>Soya</b><span>Andrew'dan keyin darhol takrorla</span></button>
      <button class="mode c" id="m1" type="button" ${ok ? "" : 'aria-disabled="true"'}><span class="ic">${M_ORDER}</span><b>Gap tuzish</b><span>So'zlardan to'liq gap yig'ing</span></button>
      <button class="mode p" id="m2" type="button" ${ok ? "" : 'aria-disabled="true"'}><span class="ic">${M_LISTEN}</span><b>Tinglab tushunish</b><span>Gapni eshitib, ma'nosini toping</span></button>
      <button class="mode g" id="m3" type="button" ${ok ? "" : 'aria-disabled="true"'}><span class="ic">${M_SPEED}</span><b>Tezkor sinov</b><span>60 soniya · rekord: ${S.best.speed || 0}</span></button>
      <button class="mode l" id="m4" type="button"><span class="ic">${M_VOCAB}</span><b>Lug'atim</b><span>${n} ta so'z va takrorlash kunlari</span></button>
    </div>
  `, "practice");
  bindTop();
  if (ok) { $("m1").onclick = practiceOrder; $("m2").onclick = practiceListen; $("m3").onclick = speedQuiz; }
  $("m4").onclick = vocab;
  $("m5").onclick = practiceSpeak; $("m6").onclick = dialogsList; $("m7").onclick = aboutMe; $("m8").onclick = storiesList;
}

function practiceOrder() {
  const ws = shuffle(learnedWords()).slice(0, 8);
  const allTok = [...new Set(ALL.flatMap((w) => tokens(w.ex)))];
  const queue = ws.map((w) => {
    const tg = tokens(w.ex).map((x) => x.toLowerCase());
    const extra = shuffle(allTok.filter((x) => !tg.includes(x.toLowerCase()))).slice(0, 2);
    return { type: "order", en: w.ex, uz: w.exUz, extra, wid: w.id };
  });
  runQueue(queue, { back: practiceTab, onDone: (m, ok, n) => practiceDone("Gap tuzish", ok, n, practiceOrder) });
}

function practiceListen() {
  const ws = shuffle(learnedWords()).slice(0, 8);
  const queue = ws.map((w) => ({ type: "listen", en: w.ex, uz: w.exUz, wid: w.id }));
  runQueue(queue, { back: practiceTab, pool: ALL.map((w) => w.exUz), onDone: (m, ok, n) => practiceDone("Tinglab tushunish", ok, n, practiceListen) });
}

function practiceDone(title, ok, n, again) {
  addXP(10); bumpStreak(); save();
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><h2>${esc(title)}</h2></div>
    <div class="score">${ok}/${n}</div>
    <p class="center muted">birinchi urinishda to'g'ri</p>
    <p class="center"><span class="xpgain">+10 XP bonus</span></p>
    <div class="grow"></div>
    <button class="btn main" id="ag" type="button">Yana bir marta</button>
    <button class="btn ghost" id="bk" type="button">Mashq zaliga</button>
  `);
  $("quit").onclick = practiceTab; $("bk").onclick = practiceTab; $("ag").onclick = again;
}

function speedQuiz() {
  const words = learnedWords();
  let left = 60, score = 0, lock = false;
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><div class="timer" id="tm">60</div><span class="chip xp">${BOLT}<span id="sc">0</span></span></div>
    <div class="task-title center">To'g'ri javobni tez toping</div>
    <div id="qa" style="display:flex;flex-direction:column;gap:14px"></div>
  `);
  $("quit").onclick = practiceTab;
  function q() {
    const w = pick(words), dir = Math.random() < 0.5 ? "en" : "uz";
    const field = dir === "en" ? "en" : "uz";
    const opts = shuffle([w, ...others(w, 3, field)]);
    window.__t = { type: "speed", w, dir };
    $("qa").innerHTML = `<div class="card"><span class="tag ${dir === "en" ? "uz" : "en"}">${dir === "en" ? "O'zbekcha" : "Inglizcha"}</span><div class="word sm">${esc(dir === "en" ? w.uz : w.en)}</div></div>
      <div class="opts">${opts.map((o) => `<button class="opt" data-id="${esc(o.id)}" type="button">${esc(o[field])}</button>`).join("")}</div>`;
    lock = false;
    $app.querySelectorAll("#qa .opt").forEach((b) => b.onclick = () => {
      if (lock) return; lock = true;
      const ok = b.dataset.id === w.id;
      b.classList.add(ok ? "right" : "wrong");
      if (ok) { score++; $("sc").textContent = score; ding(true); }
      else { ding(false); $app.querySelector(`#qa .opt[data-id="${CSS.escape(w.id)}"]`).classList.add("right"); }
      later(q, ok ? 300 : 900);
    });
  }
  q();
  every(() => {
    left--; $("tm").textContent = left;
    if (left <= 0) {
      stopTimers();
      const best = S.best.speed || 0, rec = score > best;
      if (rec) S.best.speed = score;
      addXP(score * 2); bumpStreak(); save();
      html(`
        <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><h2>Vaqt tugadi</h2></div>
        <div class="score">${score}</div>
        <p class="center muted">${rec ? "Yangi rekord!" : `Rekord: ${best}`}</p>
        <p class="center"><span class="xpgain">+${score * 2} XP</span></p>
        <div class="grow"></div>
        <button class="btn main" id="ag" type="button">Yana o'ynash</button>
        <button class="btn ghost" id="bk" type="button">Mashq zaliga</button>
      `);
      $("quit").onclick = practiceTab; $("bk").onclick = practiceTab; $("ag").onclick = speedQuiz;
    }
  }, 1000);
}

function vocab() {
  const ws = learnedWords().sort((a, b) => S.words[a.id].due - S.words[b.id].due);
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Orqaga">←</button><h2>Lug'atim · ${ws.length}</h2></div>
    ${ws.length ? `<p class="muted">So'zni bossangiz, talaffuzini eshitasiz. Kataklar so'z qanchalik mustahkamligini ko'rsatadi.</p>
    <div class="res">${ws.map((w) => {
      const v = S.words[w.id], d = Math.round((v.due - startOfDay()) / DAY);
      return `<button class="resw" data-say="${esc(w.en)}" type="button"><div><b>${esc(w.en)}</b><small>${esc(w.uz)}</small></div>
        <div class="vr"><span class="boxes">${INTERVALS.map((_, k) => `<i class="${k <= v.box ? "on" : ""}"></i>`).join("")}</span><small>${d <= 0 ? "bugun" : d === 1 ? "ertaga" : `${d} kundan keyin`}</small></div></button>`;
    }).join("")}</div>`
    : `<div class="card"><b>Hali so'z yo'q</b><span class="muted">So'zlar bo'limida birinchi paketni tugatsangiz, o'rgangan so'zlaringiz shu yerda chiqadi.</span></div>`}
  `);
  $("quit").onclick = practiceTab;
  on("[data-say]", (e) => speak(e.currentTarget.dataset.say));
}

home();

}
