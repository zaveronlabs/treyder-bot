// ---------- 2-bo'lim: Darslar ----------
function lessonsTab() {
  if (FOLDER.l) return lessonFolder();
  const done = LESSONS.filter((l) => ldone(l)).length;
  const wr = lvRank(workLv());
  let nextL = LORDER.find((i) => !ldone(LESSONS[i]) && lvRank(LESSONS[i].lv) >= wr);
  if (nextL === undefined) nextL = LORDER.find((i) => !ldone(LESSONS[i]));
  if (nextL === undefined) nextL = -1;
  html(`${topBar()}
    <section class="panel hero">
      <div><h2>Grammatika darslari</h2><p>Har dars 6 bosqich: hikoya, payqash, qoida, tushunish, mashq va sinov. 80% dan o'tsang, dars o'zlashtiriladi va vaqti-vaqti bilan takrorlanadi.</p></div>
      <div class="meter"><i style="width:${(done / LESSONS.length) * 100}%"></i></div>
      <span class="muted">${done} / ${LESSONS.length} dars o'zlashtirildi</span>
      ${dueRev().length ? `<button class="btn ghost" id="rv" type="button">Takrorlash vaqti · ${dueRev().length} dars</button>` : ""}
      ${nextL >= 0 ? `<div class="row"><button class="btn main" id="nl" type="button">${done ? "Davom ettirish" : "Birinchi dars"}</button></div>` : ""}
    </section>
    <div class="sec">Papkalar</div>
    ${folderGrid(lessonFolders(nextL))}
  `, "lessons");
  bindTop();
  if ($("nl")) $("nl").onclick = () => lessonTheory(nextL);
  if ($("rv")) $("rv").onclick = reviewLessons;
  on("[data-f]", (e) => { FOLDER.l = e.currentTarget.dataset.f; lessonFolder(); });
}
const inLFolder = (l, key) => key === "dlg" ? !!l.dialog : !l.dialog && l.lv === key;
function lessonFolders(nextL) {
  const nx = nextL >= 0 ? LESSONS[nextL] : null;
  const out = LVS.map((lv) => {
    const ls = LESSONS.filter((l) => inLFolder(l, lv));
    return { key: lv, big: lv, name: LV_NAME[lv], n: ls.length, done: ls.filter((l) => ldone(l)).length, unit: "dars", cls: (lv === workLv() ? "mine " : "") + (nx && inLFolder(nx, lv) ? "next" : "") };
  }).filter((f) => f.n);
  const ds = LESSONS.filter((l) => l.dialog);
  out.push({ key: "dlg", big: "Suhbat", name: "Suhbatlar", n: ds.length, done: ds.filter((l) => ldone(l)).length, unit: "suhbat", ic: CHAT_IC, cls: "street" + (nx && nx.dialog ? " next" : "") });
  return out;
}
function lessonFolder() {
  const key = FOLDER.l, wr = lvRank(workLv());
  let nextL = LORDER.find((i) => !ldone(LESSONS[i]) && lvRank(LESSONS[i].lv) >= wr);
  if (nextL === undefined) nextL = LORDER.find((i) => !ldone(LESSONS[i]));
  const idx = LORDER.filter((i) => inLFolder(LESSONS[i], key));
  const done = idx.filter((i) => ldone(LESSONS[i])).length;
  const title = key === "dlg" ? "Suhbatlar" : `${key} · ${LV_NAME[key]}`;
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Orqaga">←</button><h2>${esc(title)}</h2></div>
    <div class="fhead"><span class="muted">${done} / ${idx.length} tugatildi${key === workLv() ? " · sening darajang" : ""}</span><div class="meter"><i style="width:${idx.length ? (done / idx.length) * 100 : 0}%"></i></div></div>
    <div class="list">
      ${idx.map((i, k) => {
        const l = LESSONS[i], st = ldone(l) ? S.lessons[l.id] : null, redo = !st && S.lessons[l.id] && deepOf(l);
        return `<button class="item ${st ? "done" : i === nextL ? "next" : ""}" data-l="${i}" type="button">
          <span class="num">${st ? CHECK : k + 1}</span>
          <span class="body"><span class="title">${esc(l.title.replace(/^Suhbat: /, ""))}${key === "dlg" ? ` <small class="lvt">${l.lv}</small>` : ""}</span><span class="sub">${redo ? "↻ yangi chuqur dars · " : ""}${esc(l.sub)}</span></span>
          <span class="end">${st ? stars(st.stars) : ""}</span>
        </button>`;
      }).join("")}
    </div>
  `, "lessons");
  $("quit").onclick = () => { FOLDER.l = null; lessonsTab(); };
  on(".item", (e) => lessonTheory(+e.currentTarget.dataset.l));
}

// har darsda 2 ta gapirish mashqi: misollar (suhbatda esa B qatorlari)
const lessonSay = (L) => L.dialog ? L.rows.filter((r) => r[0] === "B").map((r) => ({ en: r[1], uz: r[2] })) : (L.ex || []).map((r) => ({ en: r[0], uz: r[1] }));
function lessonTheory(li) {
  if (deepOf(LESSONS[li])) return deepLesson(li);
  const L = LESSONS[li];
  const row = (r) => L.dialog
    ? `<div class="tr"><span class="who">${esc(r[0])}</span><div><b>${esc(r[1])}</b><br><span>${esc(r[2])}</span></div><button class="say" data-say="${esc(r[1])}" type="button" aria-label="Tinglash">${SPK}</button></div>`
    : `<div class="tr"><b>${esc(r[0])}</b><span>${esc(r[1])}</span><button class="say" data-say="${esc(sayable(r[0]))}" type="button" aria-label="Tinglash">${SPK}</button></div>`;
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Orqaga">←</button><h2>${esc(L.title)}</h2></div>
    <div class="card"><span class="tag pink">${L.dialog ? "Suhbat" : "Qoida"}</span><div class="rule">${L.rule}</div></div>
    <div class="tbl ${L.dialog ? "dialog" : ""}">${L.rows.map(row).join("")}</div>
    ${L.note ? `<div class="note">${esc(L.note)}</div>` : ""}
    ${L.ex ? `<div class="sec">Misollar</div><div class="tbl">${L.ex.map((r) => `<div class="tr"><b>${esc(r[0])}</b><span>${esc(r[1])}</span><button class="say" data-say="${esc(r[0])}" type="button" aria-label="Tinglash">${SPK}</button></div>`).join("")}</div>` : ""}
    <div class="grow"></div>
    ${L.dialog ? `<button class="btn ghost" id="rp" type="button">Andrew bilan gaplashish</button>` : ""}
    <button class="btn main" id="go" type="button">Mashqni boshlash · ${L.tasks.length + Math.min(2, lessonSay(L).length)}</button>
  `);
  $("quit").onclick = lessonsTab;
  if ($("rp")) $("rp").onclick = () => rolePlay(li, "B", () => lessonTheory(li));
  on("[data-say]", (e) => speak(e.currentTarget.dataset.say));
  $("go").onclick = () => startLesson(li);
}

function startLesson(li) {
  const L = LESSONS[li];
  const queue = L.tasks.map((t) => ({ ...t, type: t.k, lid: L.id }));
  shuffle(lessonSay(L)).slice(0, 2).forEach((t) => queue.push({ ...t, type: "speak" }));
  runQueue(queue, { back: lessonsTab, pool: L.tasks.filter((t) => t.uz).map((t) => t.uz), onDone: (misses) => lessonResult(li, misses) });
}

function lessonResult(li, misses) {
  const L = LESSONS[li];
  const st = misses === 0 ? 3 : misses <= 2 ? 2 : 1;
  const prev = S.lessons[L.id];
  S.lessons[L.id] = { stars: Math.max(st, prev ? prev.stars : 0), at: Date.now() };
  addXP(20); bumpStreak(); save(); dayMark("lesson");
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><h2>Dars tugadi</h2></div>
    <div class="big-stars" role="img" aria-label="${st} yulduz">${stars(st)}</div>
    <p class="center"><span class="xpgain">+20 XP bonus</span></p>
    <p class="center muted">"${esc(L.title)}": ${misses === 0 ? "bitta ham xatosiz!" : `${misses} ta xato. Qoidani yana bir ko'rib chiqing.`}</p>
    <div class="grow"></div>
    ${nextLessonOf(li) !== undefined ? `<button class="btn main" id="nx" type="button">Keyingi dars</button>` : ""}
    <button class="btn ghost" id="bk" type="button">Darslar ro'yxati</button>
  `);
  $("quit").onclick = lessonsTab; $("bk").onclick = lessonsTab;
  if ($("nx")) $("nx").onclick = () => lessonTheory(nextLessonOf(li));
}

// ---------- Chuqur darslar ----------
// Har dars 6 bosqich: kontekst (hikoya) → payqash (shaklni topish) → qoida (ma'no, tuzilish, o'zbekchadan farqi, xatolar)
// → tushunish tekshiruvi → bosqichma-bosqich mashq → yakuniy sinov (80% dan o'tsa o'zlashtirildi) → 1, 3, 7, 21, 60 kundan keyin takrorlash
const DSTEPS = ["Kontekst", "Payqash", "Qoida", "Tushunish", "Mashq", "Sinov"];
const RINT = [1, 3, 7, 21, 60];
const deepOf = (L) => (L && typeof DEEP !== "undefined" && DEEP[L.id]) || null;
const hl = (s) => esc(s).replace(/\*(.+?)\*/g, "<mark>$1</mark>");
const plain = (s) => String(s).replace(/\*/g, "");
const isEn = (s) => /^[A-Z"'][^:]*[.?!]$/.test(s) && !/[oOgG]'|\b(va|emas|uchun|bilan|yo'q)\b/.test(s);
function stepper(k) { return `<div class="dsteps">${DSTEPS.map((s, j) => `<span class="${j < k ? "ok" : j === k ? "on" : ""}">${s}</span>`).join("")}</div>`; }
function timeline(tl) {
  const W = 320, y = 44, X = (p) => (18 + p * (W - 40)).toFixed(1);
  let g = `<line x1="10" y1="${y}" x2="${W - 10}" y2="${y}" class="tl-ax"/><path d="M${W - 6} ${y} l-10 -6 v12z" class="tl-ah"/>`;
  if (tl.span) g += `<rect x="${X(tl.span[0])}" y="${y - 7}" width="${(X(tl.span[1]) - X(tl.span[0])).toFixed(1)}" height="14" rx="7" class="tl-sp"/>`
    + (tl.span[2] ? `<text x="${((+X(tl.span[0]) + +X(tl.span[1])) / 2).toFixed(1)}" y="${y - 13}" text-anchor="middle" class="tl-t">${esc(tl.span[2])}</text>` : "");
  (tl.pts || []).forEach(([p, l, cls]) => { g += `<circle cx="${X(p)}" cy="${y}" r="6" class="tl-pt ${cls || ""}"/>` + (l ? `<text x="${X(p)}" y="${y + 26}" text-anchor="middle" class="tl-t">${esc(l)}</text>` : ""); });
  if (tl.now !== null) { const n = tl.now === undefined ? 0.72 : tl.now; g += `<line x1="${X(n)}" y1="${y - 22}" x2="${X(n)}" y2="${y + 10}" class="tl-now"/><text x="${X(n)}" y="${y - 27}" text-anchor="middle" class="tl-nt">HOZIR</text>`; }
  return `<svg class="tl" viewBox="0 0 ${W} 84" role="img" aria-label="Vaqt chizig'i">${g}</svg>${tl.cap ? `<span class="muted small">${tl.cap}</span>` : ""}`;
}

// 1) maqsad va hikoya
function deepLesson(li) {
  const L = LESSONS[li], D = deepOf(L), lines = D.story.lines;
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Orqaga">←</button><h2>${esc(L.title)}</h2></div>
    ${stepper(0)}
    <div class="card goal"><span class="tag pink">Bu darsdan keyin</span><div class="rule">${D.goal}</div></div>
    <div class="sec">${esc(D.story.title || "Kichik hikoya")}</div>
    <div class="tbl dialog story" id="story">${lines.map((r, j) => `<button class="tr sl" data-j="${j}" type="button"><span class="who">${esc(r[0] || "")}</span><div><b>${hl(r[1])}</b><span class="uz">${esc(r[2])}</span></div><span class="say">${SPK}</span></button>`).join("")}</div>
    <span class="muted small">Qatorni bos, eshitasan. Ajratilgan so'zlarga e'tibor ber: bugungi mavzu shular. Avval tarjimasiz tushunishga harakat qil.</span>
    <div class="row2"><button class="btn ghost" id="all" type="button">${SPK} Hammasi</button><button class="btn ghost" id="uzt" type="button">Tarjima</button></div>
    <div class="grow"></div>
    <button class="btn main" id="go" type="button">Davom etish</button>
  `);
  $("quit").onclick = lessonsTab;
  on(".sl", (e) => speak(plain(lines[+e.currentTarget.dataset.j][1])));
  $("uzt").onclick = () => $("story").classList.toggle("showuz");
  $("all").onclick = () => {
    let j = 0;
    const nx = () => { $app.querySelectorAll(".sl").forEach((x) => x.classList.toggle("now", +x.dataset.j === j)); if (j < lines.length) speakThen(plain(lines[j++][1]), () => later(nx, 350)); };
    nx();
  };
  $("go").onclick = () => deepNotice(li);
}

// 2) payqash: shaklni o'zi topadi
function deepNotice(li) {
  const L = LESSONS[li], D = deepOf(L);
  if (!D.notice || !D.notice.length) return deepRule(li);
  runQueue(D.notice.map((t) => ({ ...t, type: "spot", lid: L.id, step: 1 })), { back: lessonsTab, onDone: () => deepRule(li) });
}

// 3) qoida
function deepRule(li, then) {
  const L = LESSONS[li], D = deepOf(L);
  const part = (p) => `<div class="card part">
      ${p.h ? `<h3>${esc(p.h)}</h3>` : ""}
      ${p.t ? `<div class="rule">${p.t}</div>` : ""}
      ${p.tl ? timeline(p.tl) : ""}
      ${p.rows ? `<div class="tbl">${p.rows.map((r) => `<div class="tr"><b>${hl(r[0])}</b><span>${esc(r[1])}</span>${/\+|[oOgG]'|\.\.\./.test(r[0]) ? "<span></span>" : `<button class="say" data-say="${esc(sayable(plain(r[0])))}" type="button" aria-label="Tinglash">${SPK}</button>`}</div>`).join("")}</div>` : ""}
      ${p.bad ? `<div class="badl">${p.bad.map((b) => `<div class="bad"><div class="no">✗ ${esc(b[0])}</div><div class="yes">✓ ${esc(b[1])}</div>${b[2] ? `<small>${b[2]}</small>` : ""}</div>`).join("")}</div>` : ""}
      ${p.n ? `<div class="note">${p.n}</div>` : ""}
    </div>`;
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Orqaga">←</button><h2>${esc(L.title)}</h2></div>
    ${stepper(2)}
    ${D.parts.map(part).join("")}
    <div class="grow"></div>
    <button class="btn main" id="go" type="button">${then ? "Tushundim, davom" : "Tushundim, tekshirib ko'ramiz"}</button>
  `);
  $("quit").onclick = lessonsTab;
  on("[data-say]", (e) => speak(e.currentTarget.dataset.say));
  $("go").onclick = then || (() => deepCCQ(li));
}

// 4) tushunganini tekshirish (ma'no savollari)
function deepCCQ(li) {
  const L = LESSONS[li], D = deepOf(L);
  if (!D.ccq || !D.ccq.length) return deepPractice(li);
  runQueue(D.ccq.map((t) => ({ ...t, type: "pick", lid: L.id, step: 3 })), {
    back: lessonsTab,
    onDone: (misses) => {
      if (misses < 2) return deepPractice(li);
      html(`
        <div class="bar"><button class="x" id="quit" type="button" aria-label="Orqaga">←</button><h2>${esc(L.title)}</h2></div>
        ${stepper(3)}
        <div class="card"><h3>Keling, qoidani yana bir ko'rib chiqamiz</h3><span class="muted">${misses} ta savolda adashding. Bu yomon emas: miya qoidani endi shakllantiryapti. Qoidani yana bir marta sekin o'qi, misollarni ovoz chiqarib takrorla.</span></div>
        <div class="grow"></div>
        <button class="btn main" id="rr" type="button">Qoidani qayta o'qish</button>
        <button class="btn ghost" id="sk" type="button">Mashqqa o'tish</button>
      `);
      $("quit").onclick = lessonsTab;
      $("rr").onclick = () => deepRule(li, () => deepCCQ(li));
      $("sk").onclick = () => deepPractice(li);
    },
  });
}

// 5) bosqichma-bosqich mashq: tanishdan qiyinga
function deepPractice(li) {
  const L = LESSONS[li], D = deepOf(L);
  const queue = D.tasks.map((t) => ({ ...t, type: t.k, lid: L.id, step: 4 }));
  shuffle(D.say || lessonSay(L)).slice(0, 3).forEach((t) => queue.push({ ...t, type: "speak", step: 4 }));
  runQueue(queue, { back: lessonsTab, pool: D.tasks.filter((t) => t.uz).map((t) => t.uz), onDone: () => deepFinalIntro(li) });
}

// 6) yakuniy sinov
function deepFinalIntro(li) {
  const L = LESSONS[li], D = deepOf(L);
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Orqaga">←</button><h2>${esc(L.title)}</h2></div>
    ${stepper(5)}
    <div class="card"><span class="tag pink">Yakuniy sinov</span><h3>${D.final.length} ta savol, yordamsiz</h3><span class="muted">Bu safar hammasi aralash. 80% va undan ko'p to'g'ri javob bersang, dars o'zlashtirilgan hisoblanadi. Keyin ilova uni 1, 3, 7 va 21 kundan keyin qisqa takrorlashga chaqiradi, shunda qoida esdan chiqmaydi.</span></div>
    <div class="grow"></div>
    <button class="btn main" id="go" type="button">Sinovni boshlash</button>
  `);
  $("quit").onclick = lessonsTab;
  $("go").onclick = () => runQueue(shuffle(D.final.map((t) => ({ ...t, type: t.k, lid: L.id, step: 5 }))), {
    back: lessonsTab, pool: D.final.filter((t) => t.uz).map((t) => t.uz),
    onDone: (misses, firstOk, total) => deepResult(li, firstOk, total),
  });
}

function deepResult(li, ok, total) {
  const L = LESSONS[li], sc = total ? ok / total : 1, pass = sc >= 0.8;
  const st = sc === 1 ? 3 : pass ? 2 : 1, prev = S.lessons[L.id] || {};
  S.lessons[L.id] = { stars: Math.max(st, prev.stars || 0), at: Date.now(), m: !!(prev.m || pass), sc: Math.max(sc, prev.sc || 0) };
  if (pass) { S.lrev = S.lrev || {}; if (!S.lrev[L.id]) S.lrev[L.id] = { n: 0, due: Date.now() + RINT[0] * 864e5 }; }
  addXP(pass ? 30 : 10); bumpStreak(); save(); dayMark("lesson");
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><h2>${pass ? "Dars o'zlashtirildi" : "Hali to'liq emas"}</h2></div>
    <div class="big-stars" role="img" aria-label="${st} yulduz">${stars(st)}</div>
    <div class="score">${Math.round(sc * 100)}%</div>
    <p class="center muted">"${esc(L.title)}": ${ok} / ${total} to'g'ri. ${pass ? (sc === 1 ? "Mukammal! Qoida to'liq tushunilgan." : "Zo'r, qoida tushunilgan. Takrorlash kunlari qolganini mustahkamlaydi.") : "O'tish uchun 80% kerak. Qoidani yana bir ko'rib chiq va sinovni qayta topshir."}</p>
    <p class="center"><span class="xpgain">+${pass ? 30 : 10} XP</span></p>
    <div class="grow"></div>
    ${pass ? (nextLessonOf(li) !== undefined ? `<button class="btn main" id="nx" type="button">Keyingi dars</button>` : "") : `<button class="btn main" id="rt" type="button">Qoidani ko'rib, qayta topshirish</button>`}
    <button class="btn ghost" id="bk" type="button">Darslar ro'yxati</button>
  `);
  $("quit").onclick = lessonsTab; $("bk").onclick = lessonsTab;
  if ($("nx")) $("nx").onclick = () => lessonTheory(nextLessonOf(li));
  if ($("rt")) $("rt").onclick = () => deepRule(li, () => deepFinalIntro(li));
}

// takrorlash (oraliqli): vaqti kelgan darslardan 3 tadan savol
function dueRev() { const now = Date.now(); return Object.keys(S.lrev || {}).filter((id) => S.lrev[id].due <= now && deepOf(LESSONS.find((l) => l.id === id))); }
function reviewLessons() {
  const ids = dueRev().slice(0, 4), bad = new Set(), queue = [];
  ids.forEach((id) => { const D = deepOf(LESSONS.find((l) => l.id === id)); shuffle([...D.final, ...D.tasks].filter((t) => t.k !== "spot")).slice(0, 3).forEach((t) => queue.push({ ...t, type: t.k, lid: id })); });
  if (!queue.length) return lessonsTab();
  runQueue(queue, {
    back: lessonsTab, pool: queue.filter((t) => t.uz).map((t) => t.uz), onMiss: (t) => bad.add(t.lid),
    onDone: (misses, ok, total) => {
      ids.forEach((id) => { const r = S.lrev[id]; r.n = bad.has(id) ? Math.max(0, r.n - 1) : Math.min(RINT.length - 1, r.n + 1); r.due = Date.now() + RINT[r.n] * 864e5; });
      addXP(15); bumpStreak(); save(); dayMark("lesson");
      html(`
        <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><h2>Takrorlash tugadi</h2></div>
        <div class="score">${ok} / ${total}</div>
        <div class="res">${ids.map((id) => { const L = LESSONS.find((l) => l.id === id), r = S.lrev[id]; return `<div class="resw"><div><b>${esc(L.title)}</b><small>${bad.has(id) ? "Adashding, tezroq yana so'raladi" : "Esingda, keyingi takrorlash"}: ${RINT[r.n]} kundan keyin</small></div></div>`; }).join("")}</div>
        <p class="center"><span class="xpgain">+15 XP</span></p>
        <div class="grow"></div>
        <button class="btn main" id="bk" type="button">Darslar ro'yxati</button>
      `);
      $("quit").onclick = lessonsTab; $("bk").onclick = lessonsTab;
    },
  });
}

// yangi mashq turlari
// spot: gapdagi kerakli so'zlarni bosib belgilaydi (payqash)
function taskSpot(head, t, finish) {
  const toks = t.s.split(/\s+/);
  const clean = (w) => w.toLowerCase().replace(/^[^a-z0-9']+|[^a-z0-9']+$/gi, "");
  const want = t.a.toLowerCase().split(/\s+/).map(clean).sort().join(" ");
  const sel = new Set();
  html(`${head}
    ${stepper(t.step || 1)}
    <div class="task-title">Payqa va belgila</div>
    <div class="card"><div class="rule">${t.q}</div>${t.uz ? `<div class="uzline">${esc(t.uz)}</div>` : ""}</div>
    <div class="bank spot">${toks.map((w, j) => `<button class="wchip" data-j="${j}" type="button">${esc(w)}</button>`).join("")}</div>
    <div class="grow"></div>
    <button class="btn main" id="chk" type="button" disabled>Tekshirish</button>
  `);
  let locked = false;
  on(".spot .wchip", (e) => {
    if (locked) return;
    const j = +e.currentTarget.dataset.j;
    sel.has(j) ? sel.delete(j) : sel.add(j);
    e.currentTarget.classList.toggle("sel", sel.has(j));
    $("chk").disabled = !sel.size;
  });
  $("chk").onclick = () => {
    if (locked) return; locked = true;
    const got = [...sel].map((j) => clean(toks[j])).sort().join(" ");
    const ok = got === want;
    $app.querySelectorAll(".spot .wchip").forEach((el) => { const w = clean(toks[+el.dataset.j]); if (want.split(" ").includes(w)) el.classList.add("hit"); });
    speak(t.s);
    finish(ok, null, t.a);
  };
}
// pick: gap + savol + variantlar (ma'no savoli yoki "qaysi gap to'g'ri?")
function taskPick(head, t, finish) {
  const opts = shuffle([t.a, ...t.o]);
  html(`${head}
    ${t.step ? stepper(t.step) : ""}
    <div class="task-title">${esc(t.title || (t.s ? "Ma'nosini o'yla" : "To'g'risini tanla"))}</div>
    <div class="card">${t.s ? `<div class="word sm">${hl(t.s)} <button class="say" id="sw" type="button" aria-label="Tinglash">${SPK}</button></div>` : ""}<div class="rule">${t.q}</div></div>
    <div class="grow"></div>
    <div class="opts sent">${opts.map((o, k) => `<button class="opt" data-k="${k}" type="button">${esc(o)}</button>`).join("")}</div>
  `);
  if (t.s) { $("sw").onclick = () => speak(plain(t.s)); later(() => speak(plain(t.s)), 250); }
  let locked = false;
  on(".opt", (e) => {
    if (locked) return; locked = true;
    const ok = opts[+e.currentTarget.dataset.k] === t.a;
    e.currentTarget.classList.add(ok ? "right" : "wrong");
    if (!ok) [...$app.querySelectorAll(".opt")].find((x) => opts[+x.dataset.k] === t.a).classList.add("right");
    if (!t.s && isEn(t.a)) speak(t.a);
    finish(ok, null, t.a);
  });
}
// type: kerakli shaklni o'zi yozadi (eng kuchli eslab qolish)
const normAns = (s) => String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/[.!?,]+$/g, "").replace(/\s+/g, " ").trim();
function taskType(head, t, finish) {
  const [a, b] = t.s.split("___"), ans = [].concat(t.a);
  html(`${head}
    <div class="task-title">O'zing yoz</div>
    <div class="card"><div class="sent">${esc(a)}<span class="blank" id="blank">?</span>${esc(b)}</div>${t.h ? `<span class="tag pink">${esc(t.h)}</span>` : ""}<div class="uzline">${esc(t.uz || "")}</div></div>
    <div class="row aitype"><input id="inp" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Javobni yoz"></div>
    <div class="grow"></div>
    <button class="btn main" id="chk" type="button" disabled>Tekshirish</button>
  `);
  const inp = $("inp");
  inp.oninput = () => { $("chk").disabled = !inp.value.trim(); };
  inp.onkeydown = (e) => { if (e.key === "Enter" && inp.value.trim()) $("chk").click(); };
  later(() => inp.focus(), 200);
  let locked = false;
  $("chk").onclick = () => {
    if (locked) return; locked = true; inp.disabled = true;
    const ok = ans.some((x) => normAns(x) === normAns(inp.value));
    const bl = $("blank"); bl.textContent = ok ? inp.value.trim() : ans[0]; bl.classList.add("ok");
    const full = a + ans[0] + b; speak(full);
    finish(ok, null, full);
  };
}

function practiceOrder() {
  const ws = shuffle(learnedWords()).slice(0, 8);
  const allTok = [...new Set(ALL.flatMap((w) => tokens(w.ex)))];
  const queue = ws.map((w) => {
    const tg = tokens(w.ex).map((x) => x.toLowerCase());
    const extra = shuffle(allTok.filter((x) => !tg.includes(x.toLowerCase()))).slice(0, 2);
    return { type: "order", en: w.ex, uz: w.exUz, extra, wid: w.id };
  });
  runQueue(queue, { back: practiceTab, onDone: (m, ok, n) => practiceDone("Gap tuzish", ok, n, practiceOrder) });
}

function practiceListen() {
  const ws = shuffle(learnedWords()).slice(0, 8);
  const queue = ws.map((w) => ({ type: "listen", en: w.ex, uz: w.exUz, wid: w.id }));
  runQueue(queue, { back: practiceTab, pool: ALL.map((w) => w.exUz), onDone: (m, ok, n) => practiceDone("Tinglab tushunish", ok, n, practiceListen) });
}

    <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><h2>${esc(title)}</h2></div>

    <button class="btn main" id="ag" type="button">Yana bir marta</button>
    <button class="btn ghost" id="bk" type="button">Mashq zaliga</button>
  `);
  $("quit").onclick = practiceTab; $("bk").onclick = practiceTab; $("ag").onclick = again;
}

function speedQuiz() {
  const words = learnedWords();
  let left = 60, score = 0, lock = false;
  html(`
    <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><div class="timer" id="tm">60</div><span class="chip xp">${BOLT}<span id="sc">0</span></span></div>
    <div class="task-title center">To'g'ri javobni tez toping</div>
    <div id="qa" style="display:flex;flex-direction:column;gap:14px"></div>
  `);
  $("quit").onclick = practiceTab;
  function q() {
    const w = pick(words), dir = Math.random() < 0.5 ? "en" : "uz";
    const field = dir === "en" ? "en" : "uz";
    const opts = shuffle([w, ...others(w, 3, field)]);
    window.__t = { type: "speed", w, dir };
    $("qa").innerHTML = `<div class="card"><span class="tag ${dir === "en" ? "uz" : "en"}">${dir === "en" ? "O'zbekcha" : "Inglizcha"}</span><div class="word sm">${esc(dir === "en" ? w.uz : w.en)}</div></div>
      <div class="opts">${opts.map((o) => `<button class="opt" data-id="${esc(o.id)}" type="button">${esc(o[field])}</button>`).join("")}</div>`;
    lock = false;
    $app.querySelectorAll("#qa .opt").forEach((b) => b.onclick = () => {
      if (lock) return; lock = true;
      const ok = b.dataset.id === w.id;
      b.classList.add(ok ? "right" : "wrong");
      if (ok) { score++; $("sc").textContent = score; ding(true); }
      else { ding(false); $app.querySelector(`#qa .opt[data-id="${CSS.escape(w.id)}"]`).classList.add("right"); }
      later(q, ok ? 300 : 900);
    });
  }
  q();
  every(() => {
    left--; $("tm").textContent = left;
    if (left <= 0) {
      stopTimers();
      const best = S.best.speed || 0, rec = score > best;
      if (rec) S.best.speed = score;
      addXP(score * 2); bumpStreak(); save();
      html(`
        <div class="bar"><button class="x" id="quit" type="button" aria-label="Chiqish">×</button><h2>Vaqt tugadi</h2></div>
        <div class="score">${score}</div>
        <p class="center muted">${rec ? "Yangi rekord!" : `Rekord: ${best}`}</p>
        <p class="center"><span class="xpgain">+${score * 2} XP</span></p>
        <div class="grow"></div>
        <button class="btn main" id="ag" type="button">Yana o'ynash</button>
        <button class="btn ghost" id="bk" type="button">Mashq zaliga</button>
      `);
      $("quit").onclick = practiceTab; $("bk").onclick = practiceTab; $("ag").onclick = speedQuiz;
    }
  }, 1000);
}
