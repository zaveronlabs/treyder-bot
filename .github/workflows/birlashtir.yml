name: Orqaga sinov natijalarini yig'ish
on:
  push:
    branches: [orqaga-sinov]
permissions:
  contents: write
  actions: read
jobs:
  yigish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 39114200410
          github-token: ${{ github.token }}
          path: natija
      - run: |
          python3 -c "
          import json, glob
          d = {}
          for f in glob.glob('natija/*/*.json'): d.update(json.load(open(f)))
          json.dump(d, open('orqaga_natija.json', 'w'), ensure_ascii=False, indent=1)
          print(len(d), 'sham')"
          git config user.name treyder-bot; git config user.email treyder-bot@users.noreply.github.com
          git add orqaga_natija.json && git commit -qm "orqaga sinov natijasi" && git push -q origin HEAD:orqaga-sinov
