name: Yodla APK o'rnatish sinovi
on:
  push:
    branches: [apk-sinov]
permissions:
  contents: write
jobs:
  sinov:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [34]
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: APK'ni yuklab olish
        run: |
          curl -sL -o new.apk https://github.com/zaveronlabs/treyder-bot/releases/download/yodla-apk/Yodla.apk
          ls -l *.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash qulf_sinov.sh
      - name: Natijani saqlash
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add natija || true
          git commit -m "qulf sinovi natijasi [skip ci]" || true
          git push || true
