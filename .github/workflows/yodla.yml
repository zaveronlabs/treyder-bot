name: Yodla ilova
on:
  push:
    branches: [yodla]
  workflow_dispatch:
permissions:
  contents: write
concurrency: yodla
jobs:
  yigish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yangi gaplarga Andrew ovozi
        run: |
          pip install -q edge-tts
          node tools/matnlar.js app > kerak.json
          python tools/ovoz.py kerak.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: AI modeli havolasini tekshirish
        run: curl -sIL -o /dev/null -w "model: %{http_code} %{url_effective}\n" "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm" || true
      - name: APK yig'ish
        env:
          VERSIYA: ${{ github.run_number }}
        run: |
          mkdir -p android/app/src/main/assets
          cp -r app/. android/app/src/main/assets/
          gradle -p android assembleRelease --no-daemon -q
          cp android/app/build/outputs/apk/release/app-release.apk Yodla.apk
          ls -la Yodla.apk
      - name: Saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add app/audio.js app/ovozlar.mp3 Yodla.apk
          git commit -q -m "Yodla: ovozlar va APK yangilandi [skip ci]" || exit 0
          git push origin HEAD:yodla
