name: Malumot yuklash (bir martalik)
on:
  push:
    branches: [malumot]
    paths: [yukla.py]
permissions:
  contents: write
jobs:
  yukla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python yukla.py
      - run: |
          git config user.name "treyder-bot"
          git config user.email "treyder-bot@users.noreply.github.com"
          git add 4h.csv.gz royxat.json
          git commit -q -m "100 tanga 4h tarixi"
          git push -q origin HEAD:malumot
