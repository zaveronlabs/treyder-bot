name: ijro.py ni testnetda tekshirish (kalitsiz qismlar)
permissions:
  contents: write
on:
  push:
    branches: [orqaga-sinov]
jobs:
  tekshir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orqaga-sinov
      - shell: bash {0}
        run: |
          curl -s -o ijro.py https://raw.githubusercontent.com/zaveronlabs/treyder-bot/main/ijro.py
          cat > t.py <<'PY'
          import ijro
          b = ijro.Binance("https://testnet.binancefuture.com", "soxta", "soxta")
          print("vaqt farqi ms", b.farq)
          q = b.qoidalar()
          for s in ("BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT"): print(s, q[s], b.kitob(s))
          print("yaxlit", ijro.yaxlit(0.0123456, q["BTCUSDT"][1]), ijro.yaxlit(82541.83, q["BTCUSDT"][0]))
          try: b.hisob()
          except ijro.BinanceXato as e: print("imzoli soxta kalit:", e.kod, e)
          h = ijro.bulut_holati()
          print("holat:", h["oxirgi_sana"], ijro.maqsadlar(h, {"qoida": 0.5, "short": 0.5}), ijro.maqsadlar(h, {"qoida": 1/3, "miya": 1/3, "longshort": 1/3}))
          print("eskirgan soat", (ijro.time.time() - ijro.sana_soniya(h["oxirgi_sana"])) / 3600)
          PY
          python3 t.py > manbalar.txt 2>&1
          git config user.name treyder-bot; git config user.email treyder-bot@users.noreply.github.com
          git add manbalar.txt && git commit -qm "ijro tekshiruv natijasi [skip ci]" && git push -q origin HEAD:orqaga-sinov
