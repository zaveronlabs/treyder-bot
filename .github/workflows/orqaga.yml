name: Kriptodan tashqari bozorlar tarixini yig'ish
permissions:
  contents: write
on:
  push:
    branches: [orqaga-sinov]
jobs:
  ol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orqaga-sinov
      - shell: bash {0}
        run: |
          mkdir -p bozor; python3 bozor_ol.py > bozor/log.txt 2>&1; cat bozor/log.txt
          git config user.name treyder-bot; git config user.email treyder-bot@users.noreply.github.com
          git add bozor && git commit -qm "bozorlar tarixi [skip ci]" && git push -q origin HEAD:orqaga-sinov
