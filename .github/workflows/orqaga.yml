name: Futures manbalari tekshiruvi (bir martalik)
on:
  push:
    branches: [orqaga-sinov]
jobs:
  tekshir:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://fapi.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=4h&limit=2" \
            "https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=4h&limit=2" \
            "https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT" \
            "https://api.bybit.com/v5/market/open-interest?category=linear&symbol=BTCUSDT&intervalTime=4h&limit=2" \
            "https://api.bybit.com/v5/market/account-ratio?category=linear&symbol=BTCUSDT&period=4h&limit=2" \
            "https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-volume?ccy=BTC&period=4H" \
            "https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio?ccy=BTC&period=4H" \
            "https://api.gateio.ws/api/v4/futures/usdt/contract_stats?contract=BTC_USDT&interval=4h&limit=2" \
            "https://contract.mexc.com/api/v1/contract/funding_rate/BTC_USDT" ; do
            echo "== $u"; curl -s -m 15 -w "\nHTTP %{http_code}\n" "$u" | head -c 400; echo; done
