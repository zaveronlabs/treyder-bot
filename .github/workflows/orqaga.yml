name: Gate futures tarixini yuklash (bir martalik)
permissions:
  contents: write
on:
  push:
    branches: [orqaga-sinov]
jobs:
  yukla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orqaga-sinov
      - shell: bash {0}
        run: |
          cat > t.py <<'PY'
          import json, time, urllib.request
          B = ["BTC", "ETH", "SOL", "BNB", "XRP", "DOGE", "ADA", "AVAX", "LINK", "LTC"]
          out = {}
          for b in B:
              for iv in ("4h", "1d"):
                  u = f"https://api.gateio.ws/api/v4/futures/usdt/contract_stats?contract={b}_USDT&interval={iv}&limit=2000"
                  for k in range(4):
                      try:
                          with urllib.request.urlopen(u, timeout=30) as j: d = json.load(j); break
                      except Exception as e: print(b, iv, e); time.sleep(5); d = []
                  out[f"{b}_{iv}"] = d
                  print(b, iv, len(d), time.strftime('%F', time.gmtime(d[0]['time'])) if d else "-")
          json.dump(out, open("gate_futures.json", "w"))
          PY
          python3 t.py > manbalar.txt 2>&1
          git config user.name treyder-bot; git config user.email treyder-bot@users.noreply.github.com
          git add manbalar.txt gate_futures.json && git commit -qm "gate futures tarixi [skip ci]" && git push -q origin HEAD:orqaga-sinov
