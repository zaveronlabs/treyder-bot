name: Binance futures sinov manzillarini tekshirish (bir martalik)
permissions:
  contents: write
on:
  push:
    branches: [orqaga-sinov]
jobs:
  tekshir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orqaga-sinov
      - shell: bash {0}
        run: |
          cat > t.py <<'PY'
          import json, urllib.request
          out = {}
          for baza in ["https://testnet.binancefuture.com", "https://demo-fapi.binance.com", "https://fapi.binance.com"]:
              for yol in ["/fapi/v1/time", "/fapi/v1/exchangeInfo", "/fapi/v1/ticker/bookTicker?symbol=BTCUSDT"]:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(baza + yol, headers={"User-Agent": "treyder-ai"}), timeout=30) as j:
                          d = json.load(j)
                      if "exchangeInfo" in yol:
                          d = {s["symbol"]: s["filters"] for s in d["symbols"] if s["symbol"] in ("BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT")}
                      out[baza + yol] = d
                  except Exception as e:
                      out[baza + yol] = f"XATO: {e}"
                  print(baza + yol, str(out[baza + yol])[:150])
          json.dump(out, open("binance_manzillar.json", "w"), indent=1)
          PY
          python3 t.py > manbalar.txt 2>&1
          git config user.name treyder-bot; git config user.email treyder-bot@users.noreply.github.com
          git add manbalar.txt binance_manzillar.json && git commit -qm "binance manzillar natijasi [skip ci]" && git push -q origin HEAD:orqaga-sinov
