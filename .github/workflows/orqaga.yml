name: Funding tarixini yig'ish
permissions:
  contents: write
on:
  push:
    branches: [orqaga-sinov]
jobs:
  ol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orqaga-sinov
      - shell: bash {0}
        run: |
          mkdir -p funding; python3 funding_ol.py > funding/log.txt 2>&1; cat funding/log.txt
          git config user.name treyder-bot; git config user.email treyder-bot@users.noreply.github.com
          git add funding && git commit -qm "funding tarixi [skip ci]" && git push -q origin HEAD:orqaga-sinov
