name: Yangiliklar tahlili

# Bot har 4 soatlik sham yopilishidan oldin (UTC 03:20, 07:20, ...) shu ishni chaqiradi.
# Ochiq til modeli shu serverning o'zida Ollama orqali ishlaydi, natija yangilik.json ga yoziladi.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yangilik
  cancel-in-progress: false

jobs:
  tahlil:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Ollama va tahlil
        env:
          YANGILIK_MODEL: qwen2.5:7b
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # xizmat o'zi ishga tushmasa, o'zimiz ishga tushiramiz
          curl -sf http://localhost:11434/api/version || (nohup ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 60); do curl -sf http://localhost:11434/api/version && break; sleep 2; done
          for i in 1 2 3; do ollama pull "$YANGILIK_MODEL" && break; sleep 10; done
          python3 yangilik.py
      - name: Saqlash
        run: |
          git config user.name "treyder-bot"
          git config user.email "treyder-bot@users.noreply.github.com"
          git add yangilik.json
          git commit -q -m "yangiliklar tahlili" || exit 0
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
