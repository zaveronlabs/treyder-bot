name: Treyder AI bot

# Bot ~5.5 soat davomida har daqiqada ishlaydi, keyin keyingi ishga tushishini o'zi chaqiradi.
# Jadval (schedule) zaxira sifatida qoldirildi.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: treyder-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet numpy
      - name: Botni ishga tushirish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "treyder-bot"
          git config user.email "treyder-bot@users.noreply.github.com"
          tugash=$(( $(date +%s) + 330 * 60 ))
          oxirgi_yangilik=0
          oxirgi_ai=0
          while [ "$(date +%s)" -lt "$tugash" ]; do
            git pull -q --rebase origin main || true
            python bulut.py || echo "xato, keyingi daqiqada qayta"
            git add holat.json
            git diff --cached --quiet || (git commit -q -m "holat yangilandi" && git push -q origin HEAD:main) || true
            # yangiliklar tahlili: har 4 soatlik sham yopilishidan ~40 daqiqa oldin
            if [ $(( 10#$(date -u +%H) % 4 )) -eq 3 ] && [ "$(date -u +%-M)" -ge 20 ] \
               && [ $(( $(date +%s) - oxirgi_yangilik )) -gt 7200 ]; then
              gh workflow run yangilik.yml --ref main --repo ${{ github.repository }} && oxirgi_yangilik=$(date +%s) || true
            fi
            # AI treyder: har 4 soatlik sham yopilgandan keyin (bot shamni qayta ishlab bo'lgach)
            if [ $(( 10#$(date -u +%H) % 4 )) -eq 0 ] && [ "$(date -u +%-M)" -ge 3 ] \
               && [ $(( $(date +%s) - oxirgi_ai )) -gt 7200 ]; then
              gh workflow run ai_treyder.yml --ref main --repo ${{ github.repository }} && oxirgi_ai=$(date +%s) || true
            fi
            sleep 60
          done
      - name: Keyingi ishga tushirish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat miya_sana.txt 2>/dev/null)" != "$(date -u +%Y-%m)" ]; then
            gh workflow run oqitish.yml --ref main --repo ${{ github.repository }} || true
          fi
          gh workflow run bot.yml --ref main --repo ${{ github.repository }}
