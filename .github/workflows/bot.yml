name: Treyder AI bot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treyder-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet numpy
      - name: Botni ishga tushirish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bulut.py
      - name: Holatni saqlash
        if: always()
        run: |
          git config user.name "treyder-bot"
          git config user.email "treyder-bot@users.noreply.github.com"
          git add holat.json
          git diff --cached --quiet || (git commit -m "holat yangilandi" && git push)
